<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" shape-rendering="crispEdges">
  <!-- Flashcards, maskable: icon.svg's mark on a 60 grid instead of 48, so
       it sits at 80% and inside the safe zone, the centre circle of 40% of
       the size in radius (its corners reach 20 of the 24 allowed). The
       paper runs to every edge, for any mask. -->
  <title>Flashcards</title>
  <rect width="60" height="60" fill="#ffffff"/>
  <rect x="22" y="18" width="20" height="28" fill="#141414"/>
  <rect x="18" y="14" width="20" height="28" fill="#141414"/>
  <rect x="20" y="20" width="16" height="20" fill="#ffffff"/>
</svg>
