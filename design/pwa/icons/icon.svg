<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" shape-rendering="crispEdges">
  <!-- Flashcards, the master icon. The 48 grid: the system's card, ink on
       paper, 5:7, its bar at the top, and the hard shadow of a card you can
       press. At 48px the frame is 2px and the shadow 4px, as on screen.
       Colours: the paper and ink roles. PNGs are rendered from it (README.md). -->
  <title>Flashcards</title>
  <rect width="48" height="48" fill="#ffffff"/>
  <rect x="16" y="12" width="20" height="28" fill="#141414"/>
  <rect x="12" y="8" width="20" height="28" fill="#141414"/>
  <rect x="14" y="14" width="16" height="20" fill="#ffffff"/>
</svg>
